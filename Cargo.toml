[package]
name = "smbios-spoofer"
version = "0.2.0"
edition = "2021"
description = "UEFI SMBIOS Spoofer — Full SMBIOS Types 0/1/2/3/4/11/17 + GOP GUI + Auto Chainloader"

[dependencies]
# La crate officielle pour programmer en UEFI avec Rust
uefi = { version = "0.39", features = ["alloc"] }

# Pour manipuler des tableaux UTF-16 sans allocation
arrayvec = { version = "0.7", default-features = false }

[profile.release]
opt-level = "s"       # Optimiser pour la taille (important en UEFI)
lto = true            # Link-Time Optimization
strip = true          # Enlever les symboles de debug
panic = "abort"       # Pas d'unwinding — l'UEFI ne le supporte pas
codegen-units = 1     # Meilleure optimisation

[features]
default = []
# Mode headless : zéro sortie console, boot furtif en <100ms
headless = []
# Active le spoofing d'adresse MAC (SNP StationAddress + NVRAM cleanup).
spoof-mac = []
# Active les modules d'architecture agentique expérimentaux (TDT / Hooks / Memory / Sandbox).
agentic = []

[profile.dev]
opt-level = 0
