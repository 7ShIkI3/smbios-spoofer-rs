name: UEFI Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-build:
    name: Clippy, Host Tests & UEFI Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain + UEFI Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi,x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Run Clippy Linter (Default Features)
        run: cargo clippy --target x86_64-unknown-uefi -- -D warnings

      - name: Run Clippy Linter (All Features: headless, spoof-disk, spoof-mac, agentic)
        run: cargo clippy --target x86_64-unknown-uefi --features "headless,spoof-disk,spoof-mac,agentic" -- -D warnings

      - name: Run Host Unit & Integration Tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build UEFI Release Binary (GOP GUI Mode)
        run: cargo build --release --target x86_64-unknown-uefi

      - name: Build Windows Kernel WDM Disk Filter Driver (.sys)
        run: cargo build --release --manifest-path driver/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload smbios-spoofer.efi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smbios-spoofer-efi
          path: target/x86_64-unknown-uefi/release/smbios-spoofer.efi
